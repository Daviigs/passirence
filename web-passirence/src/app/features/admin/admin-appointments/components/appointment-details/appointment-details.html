@if (layout() === 'drawer' && event(); as apt) {
  <div class="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm" (click)="close.emit()">
    <aside
      class="w-full max-w-md h-full bg-[#1B2B5E] border-l border-white/10 shadow-2xl flex flex-col min-h-0 animate-slide-up"
      (click)="$event.stopPropagation()"
    >
      @if (loading()) {
        <div class="p-8 space-y-3 flex-1">
          <div class="h-6 w-2/3 rounded bg-white/10 animate-pulse"></div>
          <div class="h-24 rounded-xl bg-white/10 animate-pulse"></div>
        </div>
      } @else {
        <app-appointment-detail-content
          [appointment]="apt"
          [phoneDisplay]="phone()"
          [editable]="editable()"
          (close)="close.emit()"
          (edit)="edit.emit(apt)"
          (cancel)="cancel.emit(apt)"
          (complete)="complete.emit(apt)"
        />
      }
    </aside>
  </div>
}

@if (layout() === 'embedded') {
  <div class="rounded-xl border border-white/10 bg-black/25 overflow-hidden flex flex-col">
    @if (event(); as apt) {
      @if (loading()) {
        <div class="p-5 space-y-3">
          <div class="h-4 w-1/2 rounded bg-white/10 animate-pulse"></div>
          <div class="h-14 rounded-xl bg-white/10 animate-pulse"></div>
        </div>
      } @else {
        <app-appointment-detail-content
          [appointment]="apt"
          [phoneDisplay]="phone()"
          [editable]="editable()"
          [compact]="true"
          (close)="close.emit()"
          (edit)="edit.emit(apt)"
          (cancel)="cancel.emit(apt)"
          (complete)="complete.emit(apt)"
        />
      }
    } @else {
      <div class="p-6 text-center">
        <p class="text-white/30 text-2xl mb-2">◎</p>
        <p class="text-white/50 text-sm font-medium">Selecione um agendamento</p>
        <p class="text-white/30 text-xs mt-1">Clique na agenda ou na lista</p>
      </div>
    }
  </div>
}

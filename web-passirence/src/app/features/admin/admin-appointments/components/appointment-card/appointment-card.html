<button
  type="button"
  class="w-full text-left rounded-xl border border-white/10 bg-black/30 border-l-4 p-3 transition-all duration-300 hover:bg-black/45 hover:border-yellow-600/30 hover:shadow-lg hover:-translate-y-0.5"
  [class]="accent()"
  (click)="select.emit(event())"
>
  <div class="flex items-start justify-between gap-2 mb-2">
    <p class="text-white font-bold text-sm truncate">{{ event().clientName }}</p>
    <app-appointment-status-badge [status]="event().status" [label]="event().statusLabel" />
  </div>
  @if (!compact()) {
    <p class="text-white/50 text-xs truncate mb-1">{{ event().serviceLabel }}</p>
    <p class="text-white/40 text-xs truncate">{{ event().professionalName }}</p>
  }
  <p class="text-yellow-600 font-black text-sm tabular-nums mt-2">
    {{ event().startTime.slice(0, 5) }} — {{ event().endTime.slice(0, 5) }}
  </p>
</button>

<div>
  <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-2">Horário disponível *</label>
  @if (isLoading()) {
    <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <div class="h-10 rounded-lg bg-white/10 animate-pulse"></div>
      }
    </div>
  } @else if (times().length === 0) {
    <p class="text-white/50 text-sm py-3 px-3 rounded-xl bg-black/20 border border-white/10">
      Nenhum horário disponível para esta combinação.
    </p>
  } @else {
    <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-48 overflow-y-auto pr-1">
      @for (time of times(); track time) {
        <button
          type="button"
          class="py-2.5 rounded-lg text-sm font-bold tabular-nums border transition-all"
          [class]="selectedTime() === time
            ? 'bg-yellow-600/20 text-yellow-600 border-yellow-600/50 shadow-md'
            : 'bg-black/25 text-white/70 border-white/10 hover:border-[#0066ff]/40 hover:text-white'"
          (click)="timeSelect.emit(time)"
        >
          {{ time.slice(0, 5) }}
        </button>
      }
    </div>
  }
</div>

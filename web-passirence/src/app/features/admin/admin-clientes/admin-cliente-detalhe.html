<div class="p-4 sm:p-6 lg:p-8 min-h-full relative">

  @if (showToast()) {
    <div class="fixed top-4 right-4 left-4 sm:left-auto z-[60] sm:max-w-sm animate-fade-down" role="status">
      <div class="flex items-start gap-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur-md" [class]="toastType() === 'success' ? 'bg-[#1B2B5E]/95 border-yellow-600/40 text-white' : 'bg-red-950/90 border-red-400/40 text-red-100'">
        <p class="text-sm font-medium flex-1">{{ toastMessage() }}</p>
        <button type="button" class="text-white/50 hover:text-white" (click)="dismissToast()">×</button>
      </div>
    </div>
  }

  <button type="button" class="lg:hidden mb-4 p-2.5 rounded-xl bg-black/25 border border-white/10 text-white" aria-label="Abrir menu" (click)="openMenu()">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  @if (isLoadingCliente()) {
    <div class="rounded-2xl border border-white/10 bg-[#1B2B5E]/60 p-8 animate-pulse h-40 mb-6"></div>
  } @else if (loadError()) {
    <div class="text-center py-16 rounded-2xl border border-red-400/30 bg-red-500/10 text-red-200">
      <p>{{ loadError() }}</p>
      <button type="button" class="mt-4 text-white underline text-sm" (click)="goBack()">Voltar</button>
    </div>
  } @else if (cliente(); as c) {
    <app-cliente-details [cliente]="c" (edit)="openEditModal()" (back)="goBack()" />
    <div class="mt-6">
      <app-cliente-appointments [appointments]="appointments()" [isLoading]="isLoadingAppointments()" />
    </div>
  }

  @if (showFormModal() && cliente()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" (click)="closeFormModal()">
      <div class="w-full max-w-md rounded-2xl border border-white/10 bg-[#1B2B5E] shadow-2xl" (click)="$event.stopPropagation()">
        <div class="flex items-center justify-between px-5 py-4 border-b border-white/10">
          <h3 class="text-lg font-black text-white">Editar cliente</h3>
          <button type="button" class="p-2 text-white/50 hover:text-white" (click)="closeFormModal()">×</button>
        </div>
        <div class="p-5">
          <app-cliente-form [cliente]="cliente()" [isSaving]="isSaving()" (save)="onSave($event)" (cancel)="closeFormModal()" />
        </div>
      </div>
    </div>
  }
</div>

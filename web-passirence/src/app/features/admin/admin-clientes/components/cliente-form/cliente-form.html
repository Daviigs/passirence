<form class="flex flex-col gap-4" (ngSubmit)="submit()">
  <div>
    <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Nome *</label>
    <input
      type="text"
      class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm placeholder-white/30 focus:outline-none focus:border-yellow-600/50 focus:ring-2 focus:ring-yellow-600/20"
      [ngModel]="nome()"
      (ngModelChange)="nome.set($event)"
      name="nome"
      placeholder="Ex: João Silva"
      required
    />
  </div>

  <div>
    <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Telefone *</label>
    <input
      type="tel"
      class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm placeholder-white/30 focus:outline-none focus:border-yellow-600/50 focus:ring-2 focus:ring-yellow-600/20"
      [value]="telefone()"
      (input)="onPhoneInput($event)"
      name="telefone"
      placeholder="(00) 00000-0000"
      maxlength="15"
      required
    />
  </div>

  <div class="flex items-center justify-between gap-4 p-3 rounded-xl bg-black/15 border border-white/10">
    <span class="text-white text-sm font-medium">Cliente ativo</span>
    <label class="relative inline-flex items-center cursor-pointer">
      <input
        type="checkbox"
        class="sr-only peer"
        [ngModel]="ativo()"
        (ngModelChange)="ativo.set($event)"
        name="ativo"
      />
      <div class="w-11 h-6 bg-black/40 rounded-full peer peer-checked:bg-yellow-600/80 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div>
    </label>
  </div>

  @if (formError()) {
    <p class="text-red-300 text-sm px-3 py-2 rounded-lg bg-red-500/10 border border-red-400/30">{{ formError() }}</p>
  }

  <div class="flex flex-col-reverse sm:flex-row gap-3 pt-2">
    <button
      type="button"
      class="flex-1 py-3 rounded-xl text-sm font-bold uppercase tracking-wider text-white/70 bg-white/5 border border-white/10 hover:bg-white/10 transition-all"
      (click)="cancel.emit()"
      [disabled]="isSaving()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="flex-1 py-3 rounded-xl text-sm font-bold uppercase tracking-wider text-white bg-gradient-to-r from-[#0066ff] to-[#0052cc] hover:shadow-lg hover:-translate-y-0.5 transition-all disabled:opacity-50 border border-white/10"
      [disabled]="isSaving()"
    >
      @if (isSaving()) { Salvando... } @else { Salvar cliente }
    </button>
  </div>
</form>

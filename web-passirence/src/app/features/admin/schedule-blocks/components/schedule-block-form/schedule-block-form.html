<form class="flex flex-col gap-4" (ngSubmit)="submit()">
  <div>
    <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Tipo *</label>
    <select
      class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50 focus:ring-2 focus:ring-yellow-600/20"
      [ngModel]="type()"
      (ngModelChange)="type.set($event)"
      name="type"
      required
    >
      @for (t of typeOptions; track t.value) {
        <option [value]="t.value">{{ t.label }}</option>
      }
    </select>
  </div>

  <div class="rounded-xl border border-white/10 bg-black/15 p-3 space-y-3">
    <label class="flex items-center gap-3 cursor-pointer">
      <input
        type="checkbox"
        class="w-4 h-4 rounded border-white/20 bg-black/30 text-yellow-600 focus:ring-yellow-600/30"
        [ngModel]="isGlobal()"
        (ngModelChange)="onGlobalChange($event)"
        name="isGlobal"
      />
      <span class="text-white text-sm font-medium">Bloqueio global da barbearia</span>
    </label>

    @if (!isGlobal()) {
      <div>
        <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Profissional *</label>
        <select
          class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50"
          [ngModel]="professionalId()"
          (ngModelChange)="professionalId.set($event ? +$event : null)"
          name="professionalId"
          [required]="!isGlobal()"
        >
          <option [ngValue]="null">Selecione...</option>
          @for (p of professionals(); track p.id) {
            <option [ngValue]="p.id">{{ p.nome }}</option>
          }
        </select>
      </div>
    }
  </div>

  <div class="flex items-center justify-between gap-4 p-3 rounded-xl bg-black/15 border border-white/10">
    <span class="text-white text-sm font-medium">Recorrente</span>
    <label class="relative inline-flex items-center cursor-pointer">
      <input
        type="checkbox"
        class="sr-only peer"
        [ngModel]="isRecurring()"
        (ngModelChange)="isRecurring.set($event)"
        name="isRecurring"
      />
      <div class="w-11 h-6 bg-black/40 rounded-full peer peer-checked:bg-yellow-600/80 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div>
    </label>
    <span class="text-white/40 text-xs">{{ isRecurring() ? 'Recorrente' : 'Avulso' }}</span>
  </div>

  @if (isRecurring()) {
    <div>
      <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Dia da semana *</label>
      <select
        class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50"
        [ngModel]="weekDay()"
        (ngModelChange)="weekDay.set(+$event)"
        name="weekDay"
      >
        @for (d of weekdayOptions; track d.value) {
          <option [value]="d.value">{{ d.label }}</option>
        }
      </select>
    </div>
  } @else {
    <div>
      <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Data *</label>
      <input
        type="date"
        class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50 [color-scheme:dark]"
        [ngModel]="date()"
        (ngModelChange)="date.set($event)"
        name="date"
        required
      />
    </div>
  }

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Início *</label>
      <input
        type="time"
        class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50 [color-scheme:dark]"
        [ngModel]="startTime()"
        (ngModelChange)="startTime.set($event)"
        name="startTime"
        required
      />
    </div>
    <div>
      <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Fim *</label>
      <input
        type="time"
        class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50 [color-scheme:dark]"
        [ngModel]="endTime()"
        (ngModelChange)="endTime.set($event)"
        name="endTime"
        required
      />
    </div>
  </div>

  @if (isFullDayBlock()) {
    <p class="text-xs font-bold text-yellow-600 uppercase tracking-wider flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Dia inteiro
    </p>
  }

  <div>
    <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Motivo</label>
    <textarea
      rows="3"
      class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm placeholder-white/30 focus:outline-none focus:border-yellow-600/50 resize-none"
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
      name="reason"
      placeholder="Ex: Horário de almoço, férias coletivas..."
    ></textarea>
  </div>

  @if (formError()) {
    <p class="text-red-300 text-sm px-3 py-2 rounded-lg bg-red-500/10 border border-red-400/30">{{ formError() }}</p>
  }

  <div class="flex flex-col-reverse sm:flex-row gap-3 pt-2">
    <button
      type="button"
      class="flex-1 py-3 rounded-xl text-sm font-bold uppercase tracking-wider text-white/70 bg-white/5 border border-white/10 hover:bg-white/10 transition-all"
      (click)="cancel.emit()"
      [disabled]="isSaving()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="flex-1 py-3 rounded-xl text-sm font-bold uppercase tracking-wider text-white bg-gradient-to-r from-[#0066ff] to-[#0052cc] hover:shadow-lg hover:shadow-[#0066ff]/30 hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:transform-none border border-white/10"
      [disabled]="isSaving()"
    >
      @if (isSaving()) { Salvando... } @else { Salvar bloqueio }
    </button>
  </div>
</form>

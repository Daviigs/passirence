<section class="rounded-2xl border border-white/10 bg-[#1B2B5E]/90 backdrop-blur-md p-4 sm:p-5 animate-fade-up">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
    <h2 class="text-white font-bold text-sm uppercase tracking-widest flex items-center gap-2">
      <span class="w-1 h-4 bg-yellow-600 rounded-full"></span>
      Filtros
    </h2>
    <button
      type="button"
      class="text-xs font-bold uppercase tracking-wider text-white/50 hover:text-yellow-600 transition-colors"
      (click)="clearFilters.emit()"
    >
      Limpar filtros
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
    <div>
      <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Profissional</label>
      <select
        class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50 focus:ring-2 focus:ring-yellow-600/20 transition-all"
        [ngModel]="professionalSelectValue()"
        (ngModelChange)="onProfessionalChange($event)"
      >
        @for (opt of professionalFilterOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
        @for (p of professionals(); track p.id) {
          <option [value]="p.id">{{ p.nome }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Tipo</label>
      <select
        class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50 focus:ring-2 focus:ring-yellow-600/20 transition-all"
        [ngModel]="filters().type ?? ''"
        (ngModelChange)="onTypeChange($event)"
      >
        <option value="">Todos os tipos</option>
        @for (t of typeOptions; track t.value) {
          <option [value]="t.value">{{ t.label }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Recorrência</label>
      <select
        class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50 focus:ring-2 focus:ring-yellow-600/20 transition-all"
        [ngModel]="recurringSelectValue()"
        (ngModelChange)="onRecurringChange($event)"
      >
        @for (opt of recurringOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-[0.65rem] font-bold text-white/40 uppercase tracking-widest mb-1.5">Data</label>
      <input
        type="date"
        class="w-full px-3 py-2.5 rounded-xl border border-white/10 bg-black/25 text-white text-sm focus:outline-none focus:border-yellow-600/50 focus:ring-2 focus:ring-yellow-600/20 transition-all [color-scheme:dark]"
        [ngModel]="filters().date ?? ''"
        (ngModelChange)="onDateChange($event)"
      />
    </div>
  </div>
</section>

<article
  class="group relative overflow-hidden rounded-2xl border backdrop-blur-md p-5 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl"
  [class]="accent() === 'gold'
    ? 'bg-[#1B2B5E]/90 border-yellow-600/25 hover:border-yellow-600/50 shadow-lg shadow-black/20'
    : 'bg-black/25 border-white/10 hover:border-[#0066ff]/40 shadow-lg shadow-black/15'"
>
  <div
    class="absolute -top-8 -right-8 w-24 h-24 rounded-full opacity-20 blur-2xl transition-opacity duration-300 group-hover:opacity-35"
    [class]="accent() === 'gold' ? 'bg-yellow-600' : 'bg-[#0066ff]'"
  ></div>

  <div class="relative flex items-start justify-between gap-3">
    <div
      class="shrink-0 w-11 h-11 rounded-xl flex items-center justify-center transition-transform duration-300 group-hover:scale-110"
      [class]="accent() === 'gold'
        ? 'bg-yellow-600/15 text-yellow-600 border border-yellow-600/30'
        : 'bg-[#0066ff]/15 text-[#0066ff] border border-[#0066ff]/30'"
    >
      @switch (icon()) {
        @case ('calendar') {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        }
        @case ('users') {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        }
        @case ('scissors') {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 0L5 5m4.121 4.121L12 12" />
          </svg>
        }
        @case ('chart') {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        }
      }
    </div>
  </div>

  <div class="relative mt-4">
    <p class="text-white/50 text-xs font-bold uppercase tracking-widest mb-1">{{ label() }}</p>
    <p class="text-3xl sm:text-4xl font-black text-white tabular-nums tracking-tight">{{ value() }}</p>
    @if (subtitle()) {
      <p class="text-white/40 text-xs mt-2 font-medium">{{ subtitle() }}</p>
    }
  </div>
</article>

<header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8 animate-fade-down">
  <div class="flex items-start gap-4">
    <button
      type="button"
      class="lg:hidden shrink-0 p-2.5 rounded-xl bg-black/25 border border-white/10 text-white hover:bg-black/40 hover:border-yellow-600/40 transition-all duration-300"
      aria-label="Abrir menu"
      (click)="menuClick.emit()"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div>
      <p class="text-white/50 text-xs font-bold uppercase tracking-[0.2em] mb-1">Painel administrativo</p>
      <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
        Bem-vindo, <span class="text-yellow-600">{{ userName() }}</span>
        <span class="inline-block ml-1" aria-hidden="true">👋</span>
      </h1>
      <p class="text-white/60 text-sm mt-1.5 font-medium">{{ dateLabel() }}</p>
    </div>
  </div>

  <div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-black/20 border border-white/10 backdrop-blur-sm">
    <span class="w-2 h-2 rounded-full bg-yellow-600 animate-pulse"></span>
    <span class="text-white/70 text-xs font-semibold uppercase tracking-wider">Sistema online</span>
  </div>
</header>

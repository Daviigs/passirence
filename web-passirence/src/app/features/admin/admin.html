<div class="min-h-screen bg-gradient-to-br from-[#0a2463] via-[#0d3b82] to-[#1a5f9a] flex relative">

  @if (sidebar.isOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm lg:hidden"
      aria-label="Fechar menu"
      (click)="sidebar.close()"
    ></button>
  }

  <!-- Sidebar existente — responsiva no mobile -->
  <aside
    class="fixed lg:static inset-y-0 left-0 z-50 w-60 shrink-0 bg-black/20 border-r border-white/10 flex flex-col transition-transform duration-300 ease-out -translate-x-full lg:translate-x-0"
    [class.translate-x-0]="sidebar.isOpen()"
  >
    <div class="p-6 border-b border-white/10 flex items-center justify-between gap-2">
      <div>
        <h2 class="text-white font-black text-lg tracking-tight">Passirence</h2>
        <p class="text-white/40 text-xs mt-0.5 uppercase tracking-widest">Admin</p>
      </div>
      <button
        type="button"
        class="lg:hidden p-2 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-colors"
        aria-label="Fechar menu"
        (click)="sidebar.close()"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <nav class="flex-1 p-3 flex flex-col gap-1 overflow-y-auto">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-white/20 !text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-all text-sm font-medium"
        (click)="sidebar.close()"
      >
        <span>📊</span> Dashboard
      </a>
      <a
        routerLink="/admin/agendamentos"
        routerLinkActive="bg-white/20 !text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-all text-sm font-medium"
        (click)="sidebar.close()"
      >
        <span>📅</span> Agendamentos
      </a>
      <a
        routerLink="/admin/profissionais"
        routerLinkActive="bg-white/20 !text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-all text-sm font-medium"
        (click)="sidebar.close()"
      >
        <span>👥</span> Profissionais
      </a>
      <a
        routerLink="/admin/servicos"
        routerLinkActive="bg-white/20 !text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-all text-sm font-medium"
        (click)="sidebar.close()"
      >
        <span>✂️</span> Serviços
      </a>
      <a
        routerLink="/admin/clientes"
        routerLinkActive="bg-white/20 !text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-all text-sm font-medium"
        (click)="sidebar.close()"
      >
        <span>👤</span> Clientes
      </a>
      <a
        routerLink="/admin/bloqueios"
        routerLinkActive="bg-white/20 !text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-all text-sm font-medium"
        (click)="sidebar.close()"
      >
        <span>🚫</span> Bloqueios de Agenda
      </a>
      <a
        routerLink="/admin/whatsapp"
        routerLinkActive="bg-white/20 !text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-all text-sm font-medium"
        (click)="sidebar.close()"
      >
        <span>💬</span> WhatsApp
      </a>
      <a
        routerLink="/admin/configuracoes"
        routerLinkActive="bg-white/20 !text-white"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-white/60 hover:bg-white/10 hover:text-white transition-all text-sm font-medium"
        (click)="sidebar.close()"
      >
        <span>⚙️</span> Configurações
      </a>
    </nav>
  </aside>

  <main class="flex-1 min-w-0 overflow-auto lg:ml-0">
    <router-outlet />
  </main>
</div>

<!-- Hero Section -->
<div class="relative min-h-screen flex items-center overflow-hidden bg-gradient-to-br from-[#0a2463] via-[#0d3b82] to-[#1a5f9a]">
  <!-- Decorative blur circle -->
  <div class="absolute -top-1/4 -right-1/4 w-[700px] h-[700px] rounded-full bg-white/5 blur-3xl pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-7xl mx-auto px-6 py-20">
    <div class="flex flex-col lg:flex-row items-center gap-12 lg:gap-16">

      <!-- Lado Esquerdo -->
      <div class="flex-1 text-center lg:text-left animate-fade-up">
        <!-- Badge -->
        <div class="inline-block mb-5">
          <span class="bg-white/10 text-white px-6 py-2 text-xs font-bold tracking-[3px] uppercase border border-white/30 rounded">
            BARBEARIA PASSIRENCE
          </span>
        </div>

        <!-- Título -->
        <h1 class="text-5xl lg:text-6xl xl:text-7xl font-black leading-[1.1] text-white mb-6 tracking-tight">
          Estilo que<br>
          <span class="relative inline-block">
            define você
            <span class="absolute -bottom-1 left-0 w-full h-1 bg-white rounded-full"></span>
          </span>
        </h1>

        <!-- Descrição -->
        <p class="text-lg text-blue-100/90 max-w-md mx-auto lg:mx-0 mb-10 leading-relaxed">
          Aqui você encontra o barbeiro que sempre quis!
        </p>

        <!-- Botões -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
          <button
            class="px-10 py-4 bg-white text-[#0a2463] font-bold text-sm uppercase tracking-widest rounded shadow-[0_4px_20px_rgba(255,255,255,0.35)] hover:shadow-[0_6px_30px_rgba(255,255,255,0.5)] hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 cursor-pointer"
            routerLink="/services"
          >
            Agendar Horário
          </button>
          <button
            class="px-10 py-4 bg-white/10 text-white font-bold text-sm uppercase tracking-widest rounded border-2 border-white/40 hover:bg-white/20 hover:border-white/70 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 cursor-pointer"
            (click)="openPhoneModal()"
          >
            Meus Agendamentos
          </button>
        </div>
      </div>

      <!-- Lado Direito - Imagem -->
      <div class="flex-1 flex justify-center animate-fade-in">
        <div class="relative w-72 h-96 sm:w-96 sm:h-[480px] lg:w-[420px] lg:h-[530px] rounded-2xl overflow-hidden image-shimmer hover:-translate-y-2 transition-transform duration-500">
          <img
            src="img/PASSIRENCE branco sem fundo.png"
            alt="Barbearia Passirence"
            class="w-full h-full object-contain transition-all duration-500"
            onerror="this.style.display='none'"
          />
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal de Telefone -->
@if (showPhoneModal()) {
  <div
    class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-5"
    (click)="closePhoneModal()"
  >
    <div
      class="bg-white rounded-xl w-full max-w-md shadow-2xl animate-modal-in"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="flex justify-between items-center px-6 py-5 border-b border-gray-100">
        <h4 class="text-lg font-bold text-[#0066ff]">Consultar Agendamentos</h4>
        <button
          class="w-8 h-8 flex items-center justify-center text-xl text-gray-400 rounded-lg hover:bg-blue-50 hover:text-[#0066ff] transition-colors cursor-pointer"
          (click)="closePhoneModal()"
          aria-label="Fechar"
        >
          &times;
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-6">
        <p class="text-sm text-gray-500 mb-4">Digite o telefone cadastrado para visualizar seus horários:</p>
        <input
          type="tel"
          class="w-full px-4 py-3 text-base rounded-lg border border-blue-200 bg-blue-50/40 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#0066ff] focus:ring-2 focus:ring-[#0066ff]/20 transition-all"
          [value]="userPhone()"
          (input)="formatPhone($event)"
          placeholder="(00) 00000-0000"
          maxlength="15"
        />
        @if (lookupError()) {
          <p class="text-red-500 text-sm mt-2">{{ lookupError() }}</p>
        }
      </div>

      <!-- Footer -->
      <div class="flex gap-3 justify-end px-6 py-5 border-t border-gray-100">
        <button
          class="px-6 py-2.5 text-sm font-semibold text-gray-600 rounded-lg border border-gray-200 hover:bg-gray-50 transition-colors cursor-pointer"
          (click)="closePhoneModal()"
        >
          Cancelar
        </button>
        <button
          class="px-6 py-2.5 text-sm font-bold text-white uppercase tracking-wide bg-[#0066ff] rounded-lg shadow-md hover:bg-[#0052cc] hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none cursor-pointer"
          (click)="viewAppointments()"
          [disabled]="getPhoneDigits().length < 10 || isLookingUp()"
        >
          @if (isLookingUp()) { Buscando... } @else { Consultar }
        </button>
      </div>
    </div>
  </div>
}
